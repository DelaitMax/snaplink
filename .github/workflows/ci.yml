name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-typecheck-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm run typecheck:tests
      - run: npm run lint

  test-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: snaplink_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d snaplink_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/snaplink_test
      REDIS_URL: redis://localhost:6379
      JWT_SECRET: ci-test-secret-at-least-32-characters-long-1234
      ADMIN_EMAIL: admin@example.com
      ADMIN_PASSWORD: CiTestPassword123
      # Заведомо закрытый порт — geo-lookup сразу падает с ECONNREFUSED вместо
      # похода в реальный ip-api.com (недоступен в тестовом окружении и
      # замедлил бы тесты до GEO_LOOKUP_TIMEOUT_MS на каждый клик).
      GEO_API_BASE_URL: http://127.0.0.1:19999/json

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npm test

  build-image-backend:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck-backend, test-backend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build backend image (not pushed — validates Dockerfile only)
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: false
          tags: snaplink-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  lint-and-typecheck-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  test-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm test

  build-image-frontend:
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck-frontend, test-frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build frontend image (not pushed — validates Dockerfile only)
        uses: docker/build-push-action@v6
        with:
          context: frontend
          push: false
          tags: snaplink-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
