# Prod-оверрайд поверх docker-compose.yml:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml up --build -d
#
# В обычном (dev) docker-compose.yml все сервисы, включая postgres/redis,
# доступны с портов хоста — удобно для локальной разработки, но не годится
# для сервера, смотрящего в интернет. Этот файл:
#   - полностью скрывает postgres/redis — без ports вовсе, они остаются
#     достижимы только другими контейнерами внутри docker-сети по имени
#     сервиса;
#   - публикует backend и frontend не на 0.0.0.0 (как в dev), а только на
#     127.0.0.1 — снаружи хоста они становятся недостижимы вовсе.
#
# Дальше перед этим локальным входом ставится внешний nginx (или другой
# reverse proxy) — устанавливается на этом же хосте отдельно от
# docker-compose, слушает публичные порты (80/443, домены, TLS) и сам решает,
# куда проксировать: 127.0.0.1:$WEB_PORT (frontend, SPA + /api,/auth) или
# 127.0.0.1:$APP_PORT (backend — короткие ссылки GET /:code на своём origin,
# см. "Архитектура" в frontend/README.md). Так внешний nginx остаётся
# единственной точкой входа с точки зрения интернета.
#
# Важно: списки (в т.ч. "ports") при мердже compose-файлов по умолчанию
# ДОПИСЫВАЮТСЯ, а не заменяются — без тега !override порты из базового
# файла остались бы висеть рядом с этими.

services:
  postgres:
    ports: !override []

  redis:
    ports: !override []

  backend:
    ports: !override
      - "127.0.0.1:${APP_PORT:-3000}:3000"

  frontend:
    ports: !override
      - "127.0.0.1:${WEB_PORT:-8080}:80"
