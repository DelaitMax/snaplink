services:
  postgres:
    ports: !override []

  redis:
    ports: !override []

  backend:
    # На некоторых VPS docker-мост (bridge) не резолвит registry.npmjs.org
    # (npm ci внутри сборки виснет/падает) — host-сеть на этапе билда чинит
    # это, не трогая сеть контейнера в рантайме.
    build:
      network: host
    ports: !override
      - "127.0.0.1:${APP_PORT:-3000}:3000"
